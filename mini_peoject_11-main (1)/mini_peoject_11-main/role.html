<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServNet | Select Your Role</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-mark">S</span>
        <span>ServNet</span>
      </a>

      <nav class="nav-links" aria-label="Primary">
        <a href="index.html#services">Home</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#about">About Us</a>
        <a href="index.html#contact">Contact</a>
      </nav>

      <div class="actions">
        <a class="btn btn-outline" href="index.html">Back</a>
        <a class="btn btn-primary" href="index.html">Home</a>
      </div>
    </div>
  </header>

  <main style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat; position: relative;">
    
    <!-- Light overlay to soften the background image and match reference -->
    <div style="position: absolute; inset: 0; background: rgba(235, 243, 250, 0.85); backdrop-filter: blur(8px);"></div>
    
    <div class="container role-inner" style="position: relative; z-index: 10; width: 100%; max-width: 1000px; text-align: center;">
      <div class="role-header" style="margin-bottom: 40px;">
        <h1 style="font-size: 2.2rem; color: #101d40; margin-bottom: 8px;">Select Your Role</h1>
        <p style="color: #475569; font-size: 1rem;">Choose your account type to proceed</p>
      </div>

      <div class="role-grid-v2">
        <a href="login.html?role=customer" class="role-card-v2">
          <div class="role-icon-v2" style="background: #e8f0fe; color: #1a73e8;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
          <h3>Customer</h3>
          <p>Looking for services for your home</p>
        </a>

        <a href="login.html?role=provider" class="role-card-v2">
          <div class="role-icon-v2" style="background: #e4f7f4; color: #0b8e5b;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
          </div>
          <h3>Service Provider</h3>
          <p>Offer your professional services</p>
        </a>

        <a href="login.html?role=admin" class="role-card-v2">
          <div class="role-icon-v2" style="background: #f3e8ff; color: #9333ea;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
          </div>
          <h3>Admin</h3>
          <p>Manage users and platform settings</p>
        </a>
      </div>
    </div>
  </main>
  <script>
    const clickActionText = document.getElementById('click-action-text');
    if (clickActionText) {
      clickActionText.addEventListener('click', () => {
        alert('Role action performed!');
        clickActionText.textContent = 'Role action complete.';
        clickActionText.style.color = '#0e9f6f';
      });
    }
  </script>
</body>
</html>
